<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">

</head>

<body>
    <div class="app">
        <div class="d-flex">
            <!-- Menu hamburguesa -->
            <div id="sidebar-container" class="bg-primary">
                <div class="logo">
                    <h4 class="text-light">App de tareas</h4>
                </div>
                <div class="menu">
                    <a href="#" class="d-block text-light p-3 me-2 lead"><i class="icon ion-md-clipboard"></i>Tareas</a>
                    <a href="#" class="d-block text-light p-3 me-2 lead"><i class="icon ion-md-apps"></i>Tablero</a>
                    <a href="#" class="d-block text-light p-3 me-2 lead"><i
                            class="icon ion-md-calendar"></i>Calendario</a>
                    <a href="#" class="d-block text-light p-3 me-2 lead"><i class="icon ion-md-people"></i>equipo</a>
                    <a href="#" class="d-block text-light p-3 me-2 lead"><i class="icon ion-md-trophy"></i>Tareas
                        Completadas</a>
                    <a href="#" class="d-block text-light p-3 me-2 lead"><i
                            class="icon ion-md-settings"></i>Configuraciones</a>
                </div>
            </div>
            <div class="w-100">
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
<!-- <a class="navbar-brand" href="#">Navbar</a> quizas sea la pagina principal -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Features</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pricing</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown link
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
                <div>

                    <main class="main-content">
                        <h1 class="title">Planificador de Tareas Web</h1>

                        <div class="task-input-row">
                            <input type="text" placeholder="pon aqui tu tarea" class="task-input">
                            <button class="btn-primary">Agregar Tarea</button>
                        </div>
                        <div class="botones">
                            <button class="btn-filter">Todas</button>
                            <button class="btn-filter">Pendientes</button>
                            <button class="btn-filter">Completadas</button>
                        </div>
                        <div class="content-row">
                            <div class="task-panel">
                                <input type="Buscar" placeholder="Buscar tu tarea..." class="Buscar-input">
                                <label class="task-item">
                                    <input type="checkbox" checked> Tarea 1
                                </label>
                                <button class="btn-eliminar">Eliminar Tarea</button>
                                <button class="btn-eliminar">Eliminar Todo</button>
                            </div>
                            
<div class="calendar">
    <div class="calendar__info">
        <div class="calendar__prev" id="prev-month">&#9664;</div>
        <div class="calendar__month" id="month"></div>
        <div class="calendar__year" id="year"></div>
        <div class="calendar__next" id="next-month">&#9654;</div>
    </div>

    <div class="calendar__week">
        <div class="calendar__day calendar__item">Lunes</div>
        <div class="calendar__day calendar__item">Martes</div>
        <div class="calendar__day calendar__item">Miercoles</div>
        <div class="calendar__day calendar__item">Jueves</div>
        <div class="calendar__day calendar__item">Viernes</div>
        <div class="calendar__day calendar__item">Sabado</div>
        <div class="calendar__day calendar__item">Domingo</div>
    </div>

    <div class="calendar__dates" id="dates"></div>
</div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
